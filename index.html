<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Porto Zilla</title>
    <link rel="icon" href="images/motion-mode-fill0.svg" type="image/svg+xml"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
  </head>

  <body>
    <header>
      <div class="floating-header">
        <div class="home">
          <span><img src="images/motion-mode-fill0.svg" class="brand"/><p>Porto Zilla</p></span>
        </div>
        <nav class="menu" aria-label="Portfolio menu">
          <span class="menu-indicator" aria-hidden="true"><img src="images/video-template-fill0.svg" alt=""/></span>
          <span>Demo Reel</span>
          <span><img src="images/article-person-fill0.svg" alt=""/></span>
          <span>Curriculum Vitae</span>
          <span><img src="images/article-fill0.svg" alt=""/></span>
          <span>Cover Letter</span>
        </nav>
        <div class="switch-theme">
          <span class="dark-mode"><img src="images/dark-mode-fill0.svg"/></span>
          <span class="light-mode"><img src="images/light-mode-fill0.svg"/></span>
        </div>
      </div>
    </header>
    <main>
      <div class="video-content"></div>
      <div class="cv-content"></div>
      <div class="cl-content"></div>
    </main>
    <footer>
      <div class="floating-footer">
        <span class="socials-btn"><img src="images/instagram-brands.svg"/></span>
        <span class="socials-btn"><img src="images/youtube-brands.svg"/></span>
        <span class="socials-btn"><img src="images/facebook-brands.svg"/></span>
        <span class="socials-btn"><img src="images/tiktok-brands.svg"/></span>
        <span class="socials-btn"><img src="images/x-twitter-brands.svg"/></span>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
