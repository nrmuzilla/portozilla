<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Porto Zilla portfolio showcasing 3D animation demo reels and creative visual work." />
    <title>Porto Zilla - 3D Animation Demo Reel</title>
    <link rel="icon" href="assets/orbit-fill1.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animation.css" />
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <nav class="floating-header">
            <div class="home" aria-label="Home">
                <img src="assets/orbit-fill0.svg" alt="Logo Home" />
            </div>
            <div class="menu" aria-label="Menu Portofolio">
                <a href="index.html" style="--menu-expanded-width: 124px;">
                    <img class="menu-icon-idle" src="assets/animated-images-fill0.svg" alt="Icon Demo Reel" />
                    <img class="menu-icon-hover" src="assets/animated-images-fill1.svg" alt="" aria-hidden="true" />
                    <span>Demo Reel</span>
                </a>
                <a href="resume.html" style="--menu-expanded-width: 170px;">
                    <img class="menu-icon-idle" src="assets/article-person-fill0.svg" alt="Icon Curriculum Vitae" />
                    <img class="menu-icon-hover" src="assets/article-person-fill1.svg" alt="" aria-hidden="true" />
                    <span>Curriculum Vitae</span>
                </a>
                <a href="about.html" style="--menu-expanded-width: 142px;">
                    <img class="menu-icon-idle" src="assets/assignment-ind-fill0.svg" alt="Icon Tentang Saya" />
                    <img class="menu-icon-hover" src="assets/assignment-ind-fill1.svg" alt="" aria-hidden="true" />
                    <span>Tentang Saya</span>
                </a>
            </div>
            <div class="tema">
                <div class="switch-theme" role="button" tabindex="0" aria-label="Ganti ke tema gelap"
                    data-tooltip="Ganti Tema">
                    <span class="icon-wrapper icon-theme-dark">
                        <img class="theme-icon-idle" src="assets/dark-mode-fill0.svg" alt="Ganti Mode Gelap" />
                        <img class="theme-icon-hover" src="assets/dark-mode-fill1.svg" alt="" aria-hidden="true" />
                    </span>
                    <span class="icon-wrapper icon-theme-light">
                        <img class="theme-icon-idle" src="assets/light-mode-fill0.svg" alt="Ganti Mode Terang"
                            aria-hidden="true" />
                        <img class="theme-icon-hover" src="assets/light-mode-fill1.svg" alt="" aria-hidden="true" />
                    </span>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
